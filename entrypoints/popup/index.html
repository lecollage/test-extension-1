<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shopping Research Helper</title>
    <script type="module" src="./main.ts"></script>
  </head>
  <body>
    <main class="popup">
      <header class="popup__header">
        <p class="popup__eyebrow">Chrome Extension</p>
        <h1 class="popup__title">Shopping Research Helper</h1>
      </header>

      <section class="card">
        <p class="card__label">Active project</p>
        <div class="project-controls">
          <select id="project-select" class="field"></select>
          <button
            id="create-project"
            class="button button--ghost"
            type="button"
          >
            New
          </button>
          <button
            id="rename-project"
            class="button button--ghost"
            type="button"
          >
            Rename
          </button>
          <button
            id="delete-project"
            class="button button--danger"
            type="button"
          >
            Delete
          </button>
        </div>
      </section>

      <section class="card">
        <button
          id="save-current-page"
          class="button button--primary"
          type="button"
        >
          Save Current Page
        </button>
        <p id="status-message" class="status" aria-live="polite"></p>
      </section>

      <section class="groups">
        <h2 class="groups__title">Candidates</h2>
        <div id="groups-list"></div>
      </section>
    </main>
  </body>
</html>
